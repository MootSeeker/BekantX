<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BekantX WiFi Setup</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 24px 16px;
    color: #1a1a1a;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
    max-width: 420px;
    margin: 0 auto;
    padding: 28px 24px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  p.sub { color: #666; font-size: .9rem; margin: 0 0 20px; }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; color: #333; }
  select, input[type="password"], input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 12px;
    background: #fafafa;
  }
  select:focus, input:focus { outline: 2px solid #0071e3; border-color: #0071e3; background: #fff; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  .row select { margin-bottom: 0; flex: 1; }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:active { opacity: .75; }
  .btn-primary { background: #0071e3; color: #fff; margin-bottom: 8px; }
  .btn-secondary { background: #e5e5ea; color: #333; margin-bottom: 16px; }
  #status {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: .9rem;
    display: none;
  }
  .ok  { background: #d4edda; color: #155724; display: block !important; }
  .err { background: #f8d7da; color: #721c24; display: block !important; }
  .info { background: #d1ecf1; color: #0c5460; display: block !important; }
</style>
</head>
<body>
<div class="card">
  <h1>BekantX WiFi Setup</h1>
  <p class="sub">Wähle dein WLAN und gib das Passwort ein.</p>

  <label for="ssid">WLAN Netzwerk</label>
  <div class="row">
    <select id="ssid">
      <option value="">-- Wird gesucht... --</option>
    </select>
  </div>
  <button class="btn-secondary" onclick="scan()">&#x21bb; Aktualisieren</button>

  <label for="pass">Passwort</label>
  <input type="password" id="pass" placeholder="WLAN Passwort eingeben" autocomplete="current-password">

  <hr style="border:none;border-top:1px solid #e5e5ea;margin:20px 0 16px">
  <h2 style="font-size:1.1rem;margin:0 0 4px">MQTT Einstellungen</h2>
  <p class="sub">Verbindung zum Smart-Home Broker (optional).</p>

  <label for="mqtt_uri">Broker URI</label>
  <input type="text" id="mqtt_uri" placeholder="mqtt://192.168.1.100" autocomplete="url">

  <label for="mqtt_user">Benutzername</label>
  <input type="text" id="mqtt_user" placeholder="MQTT Benutzername" autocomplete="username">

  <label for="mqtt_pass">Passwort</label>
  <input type="password" id="mqtt_pass" placeholder="MQTT Passwort" autocomplete="off">

  <button class="btn-primary" onclick="connect()">Verbinden &amp; Speichern</button>

  <div id="status"></div>
</div>

<script>
function setStatus(msg, cls) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

function scan() {
  var sel = document.getElementById('ssid');
  sel.innerHTML = '<option value="">-- Suche läuft... --</option>';
  setStatus('Netzwerke werden gesucht...', 'info');
  fetch('/scan')
    .then(function(r) { return r.json(); })
    .then(function(nets) {
      sel.innerHTML = '';
      if (!nets || !nets.length) {
        sel.innerHTML = '<option value="">Keine Netzwerke gefunden</option>';
        setStatus('Keine Netzwerke gefunden. Bitte erneut suchen.', 'err');
        return;
      }
      nets.forEach(function(n) {
        var opt = document.createElement('option');
        opt.value = n.ssid;
        opt.textContent = n.ssid + '  (' + n.rssi + ' dBm)';
        sel.appendChild(opt);
      });
      setStatus(nets.length + ' Netzwerk(e) gefunden.', 'ok');
    })
    .catch(function() {
      sel.innerHTML = '<option value="">Fehler beim Laden</option>';
      setStatus('Fehler beim Laden der Netzwerke.', 'err');
    });
}

function connect() {
  var ssid = document.getElementById('ssid').value;
  var pass = document.getElementById('pass').value;
  if (!ssid) {
    setStatus('Bitte ein Netzwerk auswählen.', 'err');
    return;
  }
  setStatus('Anmeldedaten werden gespeichert...', 'info');
  var body = 'ssid=' + encodeURIComponent(ssid) + '&pass=' + encodeURIComponent(pass);
  var mqttUri  = document.getElementById('mqtt_uri').value;
  var mqttUser = document.getElementById('mqtt_user').value;
  var mqttPass = document.getElementById('mqtt_pass').value;
  if (mqttUri)  body += '&mqtt_uri='  + encodeURIComponent(mqttUri);
  if (mqttUser) body += '&mqtt_user=' + encodeURIComponent(mqttUser);
  if (mqttPass) body += '&mqtt_pass=' + encodeURIComponent(mqttPass);
  fetch('/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  })
    .then(function(r) { return r.json(); })
    .then(function() {
      setStatus('Gespeichert! Das Gerät verbindet sich jetzt mit "' + ssid + '". Diese Seite wird in Kürze nicht mehr verfügbar sein.', 'ok');
    })
    .catch(function() {
      setStatus('Fehler beim Speichern. Bitte erneut versuchen.', 'err');
    });
}

window.addEventListener('load', scan);
</script>
</body>
</html>
